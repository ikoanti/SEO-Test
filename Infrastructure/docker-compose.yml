services:
  app:
    build:
      context: ..
      dockerfile: Infrastructure/Dockerfile
    container_name: seo-mini-tool-app
    environment:
      NODE_ENV: production
      PORT: 3000
      OPEN_PAGE_RANK_API_KEY: ${OPEN_PAGE_RANK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      APP_BASIC_AUTH_USER: ${APP_BASIC_AUTH_USER:-}
      APP_BASIC_AUTH_PASS: ${APP_BASIC_AUTH_PASS:-}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.2
    container_name: seo-mini-tool-caddy
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
