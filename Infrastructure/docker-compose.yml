services:
  app:
    build:
      context: ..
      dockerfile: Infrastructure/Dockerfile
      target: base
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      OPEN_PAGE_RANK_API_KEY: ${OPEN_PAGE_RANK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      APP_BASIC_AUTH_USER: ${APP_BASIC_AUTH_USER:-}
      APP_BASIC_AUTH_PASS: ${APP_BASIC_AUTH_PASS:-}
      POCKETBASE_URL: ${POCKETBASE_URL:-http://pocketbase:8090}
      POCKETBASE_PUBLIC_URL: ${POCKETBASE_PUBLIC_URL:-http://localhost:8090}
      POCKETBASE_SUPERUSER_EMAIL: ${POCKETBASE_SUPERUSER_EMAIL:-}
      POCKETBASE_SUPERUSER_PASSWORD: ${POCKETBASE_SUPERUSER_PASSWORD:-}
      POCKETBASE_AUTH_COLLECTION: ${POCKETBASE_AUTH_COLLECTION:-users}
      POCKETBASE_WEBSITES_COLLECTION: ${POCKETBASE_WEBSITES_COLLECTION:-websites}
      POCKETBASE_AUDITS_COLLECTION: ${POCKETBASE_AUDITS_COLLECTION:-audits}
      POCKETBASE_WORKFLOWS_COLLECTION: ${POCKETBASE_WORKFLOWS_COLLECTION:-workflows}
      POCKETBASE_RUNS_COLLECTION: ${POCKETBASE_RUNS_COLLECTION:-runs}
      POCKETBASE_AUDIT_FINDING_TYPES_COLLECTION: ${POCKETBASE_AUDIT_FINDING_TYPES_COLLECTION:-audit_finding_types}
      POCKETBASE_AUDIT_FINDINGS_COLLECTION: ${POCKETBASE_AUDIT_FINDINGS_COLLECTION:-audit_findings}
      POCKETBASE_AUDIT_SCREENSHOTS_COLLECTION: ${POCKETBASE_AUDIT_SCREENSHOTS_COLLECTION:-audit_screenshots}
      POCKETBASE_REPORTS_COLLECTION: ${POCKETBASE_REPORTS_COLLECTION:-audit_reports}
      APP_AUTH_EMAIL: ${APP_AUTH_EMAIL:-}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:-}
      APP_AUTH_NAME: ${APP_AUTH_NAME:-}
      AUDIT_CAPTURE_HEADFUL: ${AUDIT_CAPTURE_HEADFUL:-true}
    expose:
      - "3000"
    depends_on:
      - pocketbase
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pocketbase:
    build:
      context: ..
      dockerfile: Infrastructure/pocketbase/Dockerfile
      args:
        PB_VERSION: ${POCKETBASE_VERSION:-0.37.3}
    environment:
      POCKETBASE_SUPERUSER_EMAIL: ${POCKETBASE_SUPERUSER_EMAIL:-}
      POCKETBASE_SUPERUSER_PASSWORD: ${POCKETBASE_SUPERUSER_PASSWORD:-}
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/pb/pb_data
    restart: unless-stopped

  caddy:
    image: caddy:2.11.2
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  pocketbase_data:
