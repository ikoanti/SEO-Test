services:
  app:
    build:
      target: dev
    environment:
      NODE_ENV: development
      PORT: 3000
      AUDIT_CAPTURE_HEADFUL: "true"
    command: npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ../App:/app
      - app_node_modules:/app/node_modules
    restart: unless-stopped

  pocketbase:
    ports:
      - "8090:8090"

  caddy:
    profiles: ["disabled"]

volumes:
  app_node_modules:
